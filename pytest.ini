[pytest]
testpaths = 01_Black_Box 02_White_Box_Coverage 04_Web_API 05_Security_Performance 06_Automation_Regression
addopts = -p no:cacheprovider
markers =
    regression: part of the focused regression suite (run with: pytest -m regression)
    unit: white-box unit tests on helpers.py
    api: REST API tests
    blackbox: black-box functional tests through the web forms
    security: safe, local security-oriented tests
    ui: Selenium browser tests (needs the app running on http://127.0.0.1:5000)
